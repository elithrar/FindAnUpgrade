name: Check addon

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.work/uv-cache
  UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.work/uv-python
  UV_PYTHON_BIN_DIR: ${{ github.workspace }}/.work/uv-bin
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.work/venv

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            .python-version
          prune-cache: true
      - name: Check out pinned Forever API contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Gethe/wow-ui-source
          ref: 943764493e6b16d63ded3ab304150d1f05e58b57 # Forever 1.60.1.70338
          path: .work/blizzard
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Interface/AddOns/Blizzard_UIPanels_Game/Mainline/QuestFrame.lua
      - name: Check out current Forever comparison and map contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Gethe/wow-ui-source
          ref: b401e0332adfbf0460d319b06d8ea29279a941f1 # Forever 1.60.1.70425
          path: .work/current-api
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /version.txt
            /Interface/AddOns/Blizzard_SharedMapDataProviders/QuestOfferDataProvider.lua
            /Interface/AddOns/Blizzard_SharedXMLGame/Tooltip/TooltipComparisonManager.lua
            /Interface/AddOns/Blizzard_SharedXMLGame/Tooltip/TooltipDataHandler.lua
            /Interface/AddOns/Blizzard_SharedXML/SharedTooltipTemplates.xml
            /Interface/AddOns/Blizzard_SharedXML/SharedTooltipTemplates.lua
            /Interface/AddOns/Blizzard_APIDocumentationGenerated/CurrencyInfoDocumentation.lua
            /Interface/AddOns/Blizzard_Menu/DropdownButton.lua
            /Interface/AddOns/Blizzard_GameTooltip/Mainline/GameTooltip.xml
            /Interface/AddOns/Blizzard_SharedXMLGame/Tooltip/TooltipUtil.lua
      - name: Sync locked tooling dependencies
        run: uv sync --locked
      - name: Test and package exact payload
        run: uv run --locked python -m fau_tools check
