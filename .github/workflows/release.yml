name: Release addon

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated vX.Y.Z tag on main to publish or resume
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.work/uv-cache
  UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.work/uv-python
  UV_PYTHON_BIN_DIR: ${{ github.workspace }}/.work/uv-bin
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.work/venv
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    if: github.repository == 'elithrar/FindAnUpgrade'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          python-version: '3.15.0'
          enable-cache: false
      - name: Check out pinned Forever API contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Gethe/wow-ui-source
          ref: 943764493e6b16d63ded3ab304150d1f05e58b57 # Forever 1.60.1.70338
          path: .work/blizzard
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Interface/AddOns/Blizzard_UIPanels_Game/Mainline/QuestFrame.lua
      - name: Check out current Forever comparison and map contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Gethe/wow-ui-source
          ref: b401e0332adfbf0460d319b06d8ea29279a941f1 # Forever 1.60.1.70425
          path: .work/current-api
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /version.txt
            /Interface/AddOns/Blizzard_SharedMapDataProviders/QuestOfferDataProvider.lua
            /Interface/AddOns/Blizzard_SharedXMLGame/Tooltip/TooltipComparisonManager.lua
            /Interface/AddOns/Blizzard_SharedXMLGame/Tooltip/TooltipDataHandler.lua
            /Interface/AddOns/Blizzard_SharedXML/SharedTooltipTemplates.xml
            /Interface/AddOns/Blizzard_SharedXML/SharedTooltipTemplates.lua
            /Interface/AddOns/Blizzard_APIDocumentationGenerated/CurrencyInfoDocumentation.lua
            /Interface/AddOns/Blizzard_Menu/DropdownButton.lua
            /Interface/AddOns/Blizzard_GameTooltip/Mainline/GameTooltip.xml
            /Interface/AddOns/Blizzard_SharedXMLGame/Tooltip/TooltipUtil.lua
      - name: Install locked development dependencies
        run: uv sync --locked
      - name: Test and package exact payload
        run: uv run --locked python tools/verify.py
      - name: Verify annotated tag, main ancestry, version and exact build
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python tools/release.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: |
            dist/FindAnUpgrade-*.zip
            dist/SHA256SUMS
            dist/package-receipt.json
            dist/release.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          python-version: '3.15.0'
          enable-cache: false
      - name: Install locked development dependencies
        run: uv sync --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: dist
          digest-mismatch: error
      - name: Refresh main ancestry and reject moved tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python tools/release.py --verify
      - name: Prepare and confirm exact GitHub draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: uv run --locked python tools/publish_github.py
      - name: Upload exact Forever package when CurseForge is configured
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
        run: uv run --locked python tools/publish_curseforge.py
      - name: Publish completed GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
        run: uv run --locked python tools/publish_github.py --finalize
