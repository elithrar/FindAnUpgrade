[project]
name = "findanupgrade-tooling"
version = "0.1.15"
description = "Repository-local supporting tools for FindAnUpgrade"
requires-python = ">=3.15,<3.16"
dependencies = ["lupa==2.8"]

[dependency-groups]
dev = [
    "ruff==0.17.1",
]

[tool.uv]
package = false
required-version = "==0.13.1"
# Lupa's isolated source build on Python 3.15 x64.
build-constraint-dependencies = [
    "cython==3.3.0",
    "packaging==26.3",
    "setuptools==84.0.0",
    "wheel==0.48.0",
]

[tool.ruff]
required-version = "==0.17.1"
target-version = "py315"
line-length = 88
extend-exclude = [".work", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
